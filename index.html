<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Shopify Notifications</title>
  <style>
    :root {
      color-scheme: dark;
      color: #f5f7fb;
      background: #08090b;
      font-family: "Inter", system-ui, sans-serif;
      --card: #121517;
      --card-strong: #1c1f24;
      --border: rgba(255, 255, 255, 0.08);
      --accent: #5dc7f3;
      --accent-strong: #1f9edb;
      --text-secondary: #a5abb8;
      --shadow: 0 24px 48px rgba(0, 0, 0, 0.25);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: radial-gradient(circle at top, rgba(92, 199, 243, 0.15), transparent 35%),
        linear-gradient(180deg, #050608 0%, #0b0d10 100%);
      font-size: 15px;
    }

    .phone {
      width: min(420px, 100%);
      max-width: 420px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 38px;
      overflow: hidden;
      background: #090a0c;
      box-shadow: var(--shadow);
    }

    .status-bar {
      padding: 12px 16px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #f8fafc;
      font-size: 13px;
      letter-spacing: 0.03em;
    }

    .status-bar .left,
    .status-bar .right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-bar .signal,
    .status-bar .battery {
      width: 18px;
      height: 10px;
      border: 1px solid #d8e0f0;
      border-radius: 3px;
      position: relative;
    }

    .status-bar .signal::before,
    .status-bar .battery::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, #60c2f2 0%, #2d9ceb 100%);
      border-radius: 2px;
    }

    .status-bar .battery::after {
      content: "";
      position: absolute;
      right: -4px;
      top: 2px;
      width: 3px;
      height: 6px;
      border-radius: 2px;
      background: #d8e0f0;
    }

    .app-shell {
      padding: 14px;
      display: grid;
      gap: 16px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      color: #f8fafc;
    }

    .top-bar .title {
      font-size: 18px;
      font-weight: 700;
    }

    .top-bar .label {
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      color: #bcc4d4;
      font-size: 13px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 16px;
      display: grid;
      gap: 14px;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.01);
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      color: #eff2f8;
      font-weight: 700;
      font-size: 15px;
    }

    .pill {
      background: rgba(255, 255, 255, 0.08);
      padding: 6px 12px;
      border-radius: 999px;
      color: #b8c1d3;
      font-size: 13px;
    }

    .notification {
      display: grid;
      gap: 10px;
      padding: 14px;
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(18, 24, 33, 0.96), rgba(16, 20, 27, 0.72));
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .notification .head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .notification .badge {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      background: #0b789f;
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 700;
    }

    .notification .title {
      font-size: 14px;
      font-weight: 700;
      color: #eef4ff;
    }

    .notification .subtitle {
      font-size: 13px;
      color: #a5acb8;
      line-height: 1.5;
    }

    .notification .time {
      font-size: 12px;
      color: #6f7890;
    }

    .notification .price {
      font-size: 14px;
      font-weight: 700;
      color: #f5f7fb;
    }

    .notification .source {
      font-size: 12px;
      color: #7f8ea4;
    }

    .settings-grid {
      display: grid;
      gap: 14px;
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .toggle-row label {
      display: grid;
      gap: 4px;
      color: #eef2fb;
      font-size: 13px;
    }

    .switch {
      width: 40px;
      height: 22px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      position: relative;
      flex-shrink: 0;
    }

    .switch::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fafbff;
      transition: transform 0.2s ease;
    }

    .switch.on {
      background: linear-gradient(90deg, #36d7ff 0%, #2c97e2 100%);
    }

    .switch.on::after {
      transform: translateX(18px);
    }

    .control-group {
      display: grid;
      gap: 10px;
    }

    .control-group label {
      color: #a8b0c4;
      font-size: 13px;
    }

    .control-group input {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      background: #101318;
      color: #eef2fb;
      font-size: 15px;
      padding: 12px 14px;
    }

    .control-group button {
      border: 0;
      border-radius: 16px;
      padding: 12px 14px;
      background: #1e7efc;
      color: white;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .control-group button:hover {
      transform: translateY(-1px);
      background: #0f6fe1;
    }

    .status-line {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: #a3afc8;
      font-size: 13px;
    }

    .status-line span {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 8px 10px;
      flex: 1;
      text-align: center;
    }

    .footer {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 18px 0 10px;
    }

    .footer .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.16);
    }

    .footer .dot.active {
      background: #5dc7f3;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="status-bar">
      <div class="left">
        <span>10:47</span>
      </div>
      <div class="right">
        <div class="signal"></div>
        <div class="battery"></div>
      </div>
    </div>

    <div class="app-shell">
      <div class="top-bar">
        <div class="title">Orders</div>
        <div class="label">Today</div>
      </div>

      <div class="card">
        <div class="section-title">
          <span>Powiadomienia</span>
          <span class="pill">Live</span>
        </div>

        <div id="notification-list"></div>
      </div>

      <div class="card">
        <div class="section-title">
          <span>Notification Settings</span>
          <span class="pill">Sales</span>
        </div>

        <div class="settings-grid">
          <div class="toggle-row">
            <label>
              <span>Push Notifications for Sales</span>
            </label>
            <div class="switch on" id="push-toggle"></div>
          </div>

          <div class="toggle-row">
            <label>
              <span>Auto Notifications</span>
              <small>Wyślij powiadomienia co 6 s</small>
            </label>
            <div class="switch" id="auto-toggle"></div>
          </div>

          <div class="toggle-row">
            <label>
              <span>Ka-Ching Sound</span>
            </label>
            <div class="switch on" id="sound-toggle"></div>
          </div>

          <div class="toggle-row">
            <label>
              <span>Notification Speed</span>
            </label>
            <div class="pill">Entrepreneur</div>
          </div>

          <div class="control-group">
            <label for="balance-input">Fixed Order Amount</label>
            <input type="number" id="balance-input" placeholder="Wprowadź kwotę" />
          </div>

          <div class="control-group">
            <label for="visitors-input">Visitors</label>
            <input type="number" id="visitors-input" placeholder="Wprowadź liczbę odwiedzających" />
          </div>

          <div class="status-line">
            <span>Saldo: <strong id="current-balance">6767</strong> zł</span>
            <span>Visited: <strong id="current-visitors">132</strong></span>
          </div>

          <button id="simulate-btn">Wyślij powiadomienie</button>
        </div>
      </div>
    </div>

    <div class="footer">
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

  <script>
    const notificationList = document.getElementById("notification-list");
    const balanceInput = document.getElementById("balance-input");
    const visitorsInput = document.getElementById("visitors-input");
    const updateBalance = document.getElementById("update-balance");
    const updateVisitors = document.getElementById("update-visitors");
    const currentBalance = document.getElementById("current-balance");
    const currentVisitors = document.getElementById("current-visitors");
    const simulateBtn = document.getElementById("simulate-btn");
    const pushToggle = document.getElementById("push-toggle");
    const autoToggle = document.getElementById("auto-toggle");
    const soundToggle = document.getElementById("sound-toggle");

    let balance = 6767;
    let visitors = 132;
    let notificationIndex = 0;

    const notifications = [
      {
        title: "HoH Fashion ma nowe zamówienie",
        items: 2,
        amount: 70.49,
        source: "Online Store",
        time: "1m ago",
      },
      {
        title: "HoH Fashion ma nowe zamówienie",
        items: 1,
        amount: 19.5,
        source: "Online Store",
        time: "3m ago",
      },
      {
        title: "HoH Fashion ma nowe zamówienie",
        items: 3,
        amount: 15.0,
        source: "Online Store",
        time: "5m ago",
      },
    ];

    function renderNotifications() {
      notificationList.innerHTML = "";
      notifications.slice(0, 4).forEach((notification, idx) => {
        const item = document.createElement("div");
        item.className = "notification";
        item.innerHTML = `
          <div class="head">
            <div>
              <div class="title">${notification.title}</div>
              <div class="subtitle">${notification.items} items totaling $${notification.amount.toFixed(
                2
              )} from ${notification.source}</div>
            </div>
            <div class="badge">${notification.time}</div>
          </div>
          <div class="status-line">
            <span class="source">${notification.source}</span>
            <span class="price">$${notification.amount.toFixed(2)}</span>
          </div>
        `;
        notificationList.appendChild(item);
      });
    }

    function updateSummary() {
      currentBalance.textContent = balance.toLocaleString("pl-PL");
      currentVisitors.textContent = visitors.toLocaleString("pl-PL");
    }

    function toggleSwitch(element) {
      element.classList.toggle("on");
    }

    pushToggle.addEventListener("click", () => toggleSwitch(pushToggle));
    autoToggle.addEventListener("click", () => toggleSwitch(autoToggle));
    soundToggle.addEventListener("click", () => toggleSwitch(soundToggle));

    if (updateBalance) {
      updateBalance.addEventListener("click", () => {
        const value = Number(balanceInput.value);
        if (value >= 0) {
          balance = value;
          updateSummary();
          alert("Saldo zostało zaktualizowane.");
        }
      });
    }

    if (updateVisitors) {
      updateVisitors.addEventListener("click", () => {
        const value = Number(visitorsInput.value);
        if (value >= 0) {
          visitors = value;
          updateSummary();
          alert("Liczba odwiedzających została zaktualizowana.");
        }
      });
    }

    simulateBtn.addEventListener("click", () => {
      notificationIndex = (notificationIndex + 1) % 3;
      const base = notifications[notificationIndex];
      const next = {
        title: base.title,
        items: base.items,
        amount: base.amount,
        source: base.source,
        time: "Just now",
      };
      notifications.unshift(next);
      if (notifications.length > 4) {
        notifications.pop();
      }
      renderNotifications();
    });

    renderNotifications();
    updateSummary();
  </script>
</body>
</html>
